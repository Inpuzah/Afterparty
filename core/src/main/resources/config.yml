# ClubCore configuration.
# Set the password in your server's runtime config or CLUB_DB_PASSWORD.
# Never commit real credentials. A non-empty environment variable takes priority.

database:
  # PostgreSQL host. Keep the database on localhost or a private network.
  host: "127.0.0.1"
  # 1-65535
  port: 5432
  # Database name, e.g. club_dev, club_stage, club_prod.
  name: "club_dev"
  # Least-privilege application role.
  username: "club_app"
  # Used when CLUB_DB_PASSWORD is unset or empty. Keep the bundled sample empty.
  password: ""
  # One of: disable, allow, prefer, require, verify-ca, verify-full
  ssl-mode: "prefer"
  # Maximum pooled connections (1-20). 3-5 is plenty for one small server.
  pool-size: 4
  # How long to wait for a free connection before failing (250-60000 ms).
  connection-timeout-ms: 5000

profile:
  # Profile loads that take longer than this are marked unavailable (1000-60000 ms).
  load-timeout-ms: 10000
  # Send the player a short message once their profile is loaded.
  show-ready-message: false

admin-commands:
  # Maximum amount per command, not the player's total. 0 means no command limit.
  # The 1-billion coin balance cap, positive amounts and XP overflow checks still apply.
  max-xp: 0
  max-coins: 0

displays:
  enabled: true
  server: "lobby-1"
  bossbar:
    enabled: true
    update-ticks: 10
    rotation-ticks: 100
    color: PURPLE
    overlay: PROGRESS
    progress: 1.0
    messages:
      - "<light_purple><bold>AFTERPARTY</bold></light_purple>"
      - "<aqua>Welcome to the party, {username}!</aqua>"
      - "<yellow>Bring your friends!</yellow>"
  scoreboard:
    enabled: true
    title-animation-ticks: 10
    stats-refresh-ticks: 20
    title-frames:
      - "<light_purple><bold>AFTERPARTY</bold></light_purple>"
      - "<aqua><bold>AFTERPARTY</bold></aqua>"
    lines:
      - "<gray>YOUR PROFILE</gray>"
      - "<white>Level: <yellow>{level}</yellow></white>"
      - "<white>Coins: <gold>{coins}</gold></white>"
      - " "
      - "<white>Online: <green>{online}</green></white>"
      - "<white>Server: <aqua>{server}</aqua></white>"
      - "<light_purple>AFTERPARTY</light_purple>"
