name: ClubCore
version: '${version}'
main: com.inpuzah.club.core.ClubCorePlugin
api-version: '26.3'
description: Core player identity and persistence services
author: Inpuzah

commands:
  profile:
    description: Display your Club profile
    usage: /profile
    permission: club.profile.view
  balance:
    description: Display your saved Club Coins balance
    usage: /balance
    permission: club.balance.view
  clubadmin:
    description: Administer saved XP and Club Coins
    usage: /clubadmin <xp|coins> <add|remove> <online-player|uuid> <amount> [reason]
  display:
    description: Manage your persistent lobby display preferences
    usage: /display status or /display <bossbar|scoreboard> <on|off>
    permission: club.display
  settings:
    description: Open your persistent player settings
    usage: /settings
    permission: club.settings
  friend:
    description: Manage persistent friendships and requests
    usage: /friend <add|accept|deny|cancel|remove> <player> or /friend requests [page]
    permission: club.social.use
  friends:
    description: List your friends and local online status
    usage: /friends [page]
    permission: club.social.use
  block:
    description: Block an online player
    usage: /block <online-player>
    permission: club.social.use
  unblock:
    description: Unblock a player by online name or UUID
    usage: /unblock <online-player|uuid>
    permission: club.social.use
  blocked:
    description: List players you have blocked
    usage: /blocked [page]
    permission: club.social.use

permissions:
  club.social.use:
    description: Manage your own friendships and blocks
    default: true
  club.settings:
    description: Open and change your own player settings
    default: true
  club.profile.view:
    description: View your profile
    default: true
  club.balance.view:
    description: View your own Club Coins balance
    default: true
  club.admin.xp:
    description: Award lifetime XP to known players
    default: op
  club.admin.coins:
    description: Add or remove Club Coins for known players
    default: op
  club.display:
    description: Toggle your own lobby bossbar and scoreboard
    default: true
  club.admin.displays:
    description: Reload validated display configuration
    default: op
